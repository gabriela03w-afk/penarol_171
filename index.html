<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peñarol RSS</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: white;
  }
  header {
    min-height: 230px;
    padding: 28px 22px 32px;
    position: relative;
    display: flex;
    align-items: flex-end;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,193,7,.16), transparent 32%),
      linear-gradient(135deg, #111 0%, #050505 65%);
    border-bottom: 3px solid #fbc400;
  }
  .brand h1 {
    margin: 0;
    font-size: clamp(38px, 9vw, 72px);
    letter-spacing: -2px;
  }
  .brand p {
    margin: 7px 0 0;
    color: #fbc400;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .logo {
    position: absolute;
    top: 18px;
    right: 18px;
    width: clamp(85px, 23vw, 150px);
    height: clamp(85px, 23vw, 150px);
    object-fit: contain;
  }
  main {
    width: min(1050px, 92%);
    margin: 28px auto 50px;
  }
  .card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  .title {
    margin: 0 0 18px;
    color: #fbc400;
    font-size: clamp(22px, 5vw, 34px);
  }
  .match {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: center;
    text-align: center;
  }
  .team {
    font-size: clamp(19px, 4vw, 30px);
    font-weight: 800;
  }
  .vs {
    color: #fbc400;
    font-size: 24px;
    font-weight: 900;
  }
  .cup {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 13px;
    border-radius: 999px;
    background: #fbc400;
    color: #000;
    font-weight: 900;
    font-size: 13px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    overflow: hidden;
  }
  th, td {
    padding: 15px 12px;
    border-bottom: 1px solid #292929;
    text-align: left;
  }
  th { color: #fbc400; font-size: 13px; text-transform: uppercase; }
  td:first-child, th:first-child { width: 70px; text-align: center; }
  .first {
    background: linear-gradient(90deg, rgba(251,196,0,.15), transparent);
    font-weight: 900;
  }
  .rank {
    color: #fbc400;
    font-size: 22px;
    font-weight: 900;
  }
  .players {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .player {
    background: #181818;
    border: 1px solid #2d2d2d;
    border-radius: 14px;
    padding: 18px 10px;
    text-align: center;
    font-weight: 800;
  }
  .player span {
    display: block;
    color: #fbc400;
    font-size: 12px;
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .tiktok {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #fbc400;
    color: #000;
    padding: 16px 20px;
    border-radius: 14px;
    font-weight: 900;
    font-size: 17px;
  }
  footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    padding: 0 20px 28px;
  }
  @media (max-width: 650px) {
    header { min-height: 190px; padding: 24px 18px; }
    .logo { top: 14px; right: 14px; }
    main { width: 94%; margin-top: 20px; }
    .card { padding: 18px; border-radius: 16px; }
    .match { grid-template-columns: 1fr; gap: 8px; }
    .vs { font-size: 17px; }
    .players { grid-template-columns: repeat(2, 1fr); }
    th, td { padding: 12px 8px; font-size: 14px; }
  }
</style>
</head>
